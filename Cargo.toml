[package]
name = "zk-compare-models"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2"
hex = "0.4"
hexlit = "0.5.5"
env_logger = "0.11"
log = "0.4"

# EDHOC
lakers = { version = "0.8", features = ["log"] }
lakers_crypto = { package = "lakers-crypto-rustcrypto", version = "0.8" }
rand = "0.8"

curve25519-dalek = "4"
x25519-dalek = "2.0"
chacha20poly1305 = "0.10"
blake2 = "0.10"
sha2 = "0.10"
hkdf = "0.12"
hmac = "0.12"
zeroize = "1"
subtle = "2"  